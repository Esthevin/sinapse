<!doctype html><meta charset="utf-8"><title>Cortina Sinapse</title>
<style>html,body{margin:0;height:100%;background:#1D1A16;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
text{font-family:Georgia,'Times New Roman',serif;fill:#F6F1E7}</style>
<svg viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#1D1A16"/>
<g transform="translate(580 60) scale(0.76)">
 <path id="s" d="M 690 300 C 560 170 330 230 350 400 C 370 550 670 470 676 640 C 682 800 460 860 330 730" fill="none" stroke="#F6F1E7" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
 <path id="br" d="M 676 640 L 790 600 M 350 400 L 236 440" fill="none" stroke="#F6F1E7" stroke-width="26" stroke-linecap="round" opacity=".55"/>
 <circle id="d1" cx="690" cy="300" r="74" fill="#E0452B"/><circle id="d2" cx="330" cy="730" r="74" fill="#F2A93B"/>
 <circle cx="690" cy="300" r="26" fill="#F6F1E7" opacity=".9" id="c1"/><circle cx="330" cy="730" r="26" fill="#1D1A16" opacity=".85" id="c2"/>
</g>
<text id="w" x="960" y="900" text-anchor="middle" font-size="120" letter-spacing="30" font-weight="700">SINAPSE</text>
<text id="t" x="960" y="970" text-anchor="middle" font-size="40" letter-spacing="8" opacity="0">escucha · comprende · descubre</text>
<rect id="cl" x="0" y="0" width="960" height="1080" fill="#E0452B"/><rect id="cr" x="960" y="0" width="960" height="1080" fill="#F2A93B"/>
</svg>
<script>
const $=id=>document.getElementById(id),e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3),L=$('s').getTotalLength();
function pop(t,a){const k=Math.min(1,Math.max(0,(t-a)/.35));return k<1?e(k)*1.25:1.25-.25*e((t-a-.35)/.2)}
function setT(t){ // 0..3.6 s
 // cortina que se abre (0–0.7)
 const o=e(t/.7)*960;$('cl').setAttribute('x',-o);$('cr').setAttribute('x',960+o);
 const p=e((t-.5)/1.3);$('s').style.strokeDasharray=L;$('s').style.strokeDashoffset=L*(1-p);
 $('br').style.opacity=.55*e((t-1.6)/.4);
 for(const [id,a,c] of [['d1',1.5,[690,300]],['d2',1.75,[330,730]]]){const s=pop(t,a);$(id).setAttribute('transform',`translate(${c}) scale(${s}) translate(${-c[0]} ${-c[1]})`);}
 $('c1').style.opacity=.9*e((t-1.9)/.3);$('c2').style.opacity=.85*e((t-2.0)/.3);
 $('w').style.opacity=e((t-2.0)/.5);$('w').setAttribute('y',900-20*(1-e((t-2.0)/.5)));
 $('t').style.opacity=e((t-2.6)/.5);
}
if(!location.hash.includes('manual')){let s=performance.now();(function f(n){setT(Math.min(3.6,(n-s)/1000));requestAnimationFrame(f)})(s)}
</script>
