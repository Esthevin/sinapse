name: Compilar APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run validar
      # Genera el proyecto nativo de Android (no se guarda en git).
      - run: npx expo prebuild --platform android --no-install
      # APK de instalación directa (firma de prueba): suficiente para demos y pilotos.
      - name: Compilar
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PREMIUM_CONTACT: ${{ vars.PREMIUM_CONTACT }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Sinapse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sinapse-apk
          path: Sinapse.apk
      # Publica el APK en Releases (enlace de descarga fijo "demo").
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then TAG="demo"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Sinapse.apk --target "$GITHUB_SHA" \
            --title "Sinapse $TAG" \
            --notes "APK para instalar en Android. Al abrirlo, permite instalar apps de origen desconocido."
